<svg width="900" height="360" viewBox="0 0 900 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <style><![CDATA[
      @font-face {
        font-family: "CustomFont";
        src: url("https://github.com/kumail-exp/kumail-exp/raw/main/assets/font.ttf")
             format("truetype");
      }

      .font {
        font-family: "CustomFont", monospace;
      }

      /* =====================================================
         QUOTE CAROUSEL
         Edit only the five quote strings below.
         ===================================================== */

      #quoteScroller {
        animation: quoteCycle 15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes quoteCycle {

        /* Quote 1 */
        0%,
        14% {
          transform: translateY(0px);
        }

        /* Quote 2 */
        18%,
        32% {
          transform: translateY(-42px);
        }

        /* Quote 3 */
        36%,
        50% {
          transform: translateY(-84px);
        }

        /* Quote 4 */
        54%,
        68% {
          transform: translateY(-126px);
        }

        /* Quote 5 */
        72%,
        86% {
          transform: translateY(-168px);
        }

        /* Seamless return to Quote 1 */
        90%,
        100% {
          transform: translateY(-210px);
        }
      }

      .quote {
        fill: #79eb9f;
        font-size: 17px;
        filter: url(#glow);
      }

    ]]></style>


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031711"/>
      <stop offset="100%" stop-color="#031711"/>
    </linearGradient>


    <!-- =====================================================
         TITLE GRADIENT
         ===================================================== -->

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#024e30"/>
      <stop offset="100%" stop-color="#029767"/>
    </linearGradient>


    <!-- =====================================================
         GLOW
         ===================================================== -->

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- =====================================================
         QUOTE VIEWPORT
         ===================================================== -->

    <clipPath id="quoteClip">
      <rect
        x="25"
        y="260"
        width="850"
        height="70"
        rx="6"
      />
    </clipPath>


    <!-- =====================================================
         TOP FADE
         ===================================================== -->

    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop
        offset="0%"
        stop-color="#031711"
      />

      <stop
        offset="100%"
        stop-color="#031711"
        stop-opacity="0"
      />
    </linearGradient>


    <!-- =====================================================
         BOTTOM FADE
         ===================================================== -->

    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop
        offset="0%"
        stop-color="#031711"
        stop-opacity="0"
      />

      <stop
        offset="100%"
        stop-color="#031711"
      />
    </linearGradient>

  </defs>


  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <rect
    width="900"
    height="360"
    rx="14"
    fill="url(#bg)"
  />


  <!-- =====================================================
       TERMINAL HEADER
       ===================================================== -->

  <rect
    width="900"
    height="38"
    rx="14"
    fill="#0f2b14"
  />

  <rect
    y="24"
    width="900"
    height="14"
    fill="#0f2b14"
  />


  <!-- Window buttons -->

  <circle
    cx="25"
    cy="19"
    r="6"
    fill="#ff5f56"
  />

  <circle
    cx="45"
    cy="19"
    r="6"
    fill="#ffbd2e"
  />

  <circle
    cx="65"
    cy="19"
    r="6"
    fill="#27c93f"
  />


  <!-- =====================================================
       TERMINAL PROMPT
       ===================================================== -->

  <text
    x="95"
    y="24"
    class="font"
    fill="#7dff9b"
    font-size="16"
  >
    kumail@kumail-NAVI: ~$
  </text>


  <!-- =====================================================
       COMMAND
       ===================================================== -->

  <text
    x="30"
    y="70"
    class="font"
    fill="url(#title)"
    font-size="24"
    filter="url(#glow)"
  >
    $ cat AboutMe.txt
  </text>


  <!-- =====================================================
       ABOUT ME
       ===================================================== -->

  <text
    x="35"
    y="110"
    class="font"
    fill="#1e9767"
    font-size="18"
  >

    <tspan
      x="35"
      dy="0"
    >
      Self taught idiot.
    </tspan>

    <tspan
      x="35"
      dy="30"
    >
      Around 17 years old.
    </tspan>

    <tspan
      x="35"
      dy="30"
    >
      Not working for any enemies of humanity.
    </tspan>

    <tspan
      x="35"
      dy="30"
    >
      Open to contributing to humanity and my own happiness.
    </tspan>

    <tspan
      x="35"
      dy="42"
      fill="#79eb9f"
    >
      "To do many things at once is to do neither."
    </tspan>

  </text>


  

  <!-- =====================================================
       QUOTE CAROUSEL
       ===================================================== -->

  <g clip-path="url(#quoteClip)">

    <g id="quoteScroller">

      <!-- =================================================
           EDIT THESE FIVE QUOTES
           ================================================= -->

      <text
        x="40"
        y="293"
        class="font quote"
      >
        &gt; "Be harder than the problem."
      </text>


      <text
        x="40"
        y="335"
        class="font quote"
      >
        &gt; "Curiosity is a perfectly valid excuse."
      </text>


      <text
        x="40"
        y="377"
        class="font quote"
      >
        &gt; "Learning how everything breaks."
      </text>


      <text
        x="40"
        y="419"
        class="font quote"
      >
        &gt; “well uhh so ig the problem is hard.”
      </text>


      <text
        x="40"
        y="461"
        class="font quote"
      >
        &gt;“Serial Experiment KUMAIL.”
      </text>


      <!-- Duplicate Quote 1 for seamless loop -->

      <text
        x="40"
        y="503"
        class="font quote"
      >
        &gt; "Be harder than the problem."
      </text>

    </g>

  </g>


  <!-- =====================================================
       SOFT VIEWPORT FADING
       ===================================================== -->

  <rect
    x="25"
    y="260"
    width="850"
    height="18"
    fill="url(#fadeTop)"
  />

  <rect
    x="25"
    y="312"
    width="850"
    height="18"
    fill="url(#fadeBottom)"
  />

</svg>